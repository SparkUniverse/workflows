name: Post Release Changelog

# Fetches the generated release notes for a completed Linear release and posts
# them to a Slack channel via an incoming webhook. Intended to run after
# sync-linear-release completes a release on a production deployment:
#
#   post-release-changelog:
#     needs: sync-linear-release
#     uses: SparkUniverse/workflows/.github/workflows/post-release-changelog.yaml@main
#     secrets: inherit
#     with:
#       release-id: ${{ needs.sync-linear-release.outputs.release-id }}
#
# Linear generates release notes asynchronously when the release is completed,
# so this workflow polls until the notes exist (generationStatus leaves
# "pending"). If they never turn up within the timeout, a link-only message is
# posted instead so the release is still announced.

on:
  workflow_call:
    inputs:
      release-id:
        type: string
        description: "ID or slug of the completed Linear release"
        required: true

    secrets:
      LINEAR_API_KEY:
        description: Linear API key used to read the release and its generated notes
        required: true
      SLACK_CHANGELOG_WEBHOOK_URL:
        description: Slack incoming webhook URL for the changelog channel
        required: true

permissions: {}

jobs:
  post-release-changelog:
    runs-on: namespace-profile-tiny-arm64
    timeout-minutes: 10
    steps:
      - name: Fetch release notes and post to Slack
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          SLACK_CHANGELOG_WEBHOOK_URL: ${{ secrets.SLACK_CHANGELOG_WEBHOOK_URL }}
          RELEASE_ID: ${{ inputs.release-id }}
        run: |
          set -euo pipefail

          query='query($id: String!) {
            release(id: $id) {
              name
              version
              url
              releaseNote {
                generationStatus
                url
                documentContent { content }
              }
            }
          }'

          # Poll until the generated notes exist. generationStatus is "pending"
          # while Linear is writing them, "completed" once done, and null for
          # human-written notes (ready immediately).
          response=""
          notes=""
          for attempt in $(seq 1 18); do
            response="$(curl --silent --show-error --fail https://api.linear.app/graphql \
              --header "Authorization: ${LINEAR_API_KEY}" \
              --header "Content-Type: application/json" \
              --data "$(jq --null-input --arg query "$query" --arg id "$RELEASE_ID" \
                '{query: $query, variables: {id: $id}}')")" || { sleep 10; continue; }

            if [[ "$(jq 'has("errors")' <<<"$response")" == "true" ]]; then
              echo "Linear API returned errors:" >&2
              jq '.errors' <<<"$response" >&2
              exit 1
            fi

            status="$(jq --raw-output '.data.release.releaseNote.generationStatus // "none"' <<<"$response")"
            notes="$(jq --raw-output '.data.release.releaseNote.documentContent.content // ""' <<<"$response")"
            if [[ "$status" != "pending" && -n "$notes" ]]; then
              break
            fi

            echo "release notes not ready (status: $status), attempt $attempt/18"
            notes=""
            sleep 10
          done

          if [[ -z "$response" ]]; then
            echo "error: could not reach the Linear API" >&2
            exit 1
          fi

          release_name="$(jq --raw-output '.data.release.name // "Release"' <<<"$response")"
          release_version="$(jq --raw-output '.data.release.version // ""' <<<"$response")"
          release_url="$(jq --raw-output '.data.release.url' <<<"$response")"
          notes_url="$(jq --raw-output '.data.release.releaseNote.url // ""' <<<"$response")"

          header="$release_name"
          if [[ -n "$release_version" ]]; then
            header="$release_name ($release_version)"
          fi

          if [[ -n "$notes" ]]; then
            # Convert Linear's markdown to Slack mrkdwn: strip markdown escape
            # backslashes (Linear escapes bracket/paren/star characters that
            # were typed as plain text rather than rich-text marks), escape
            # Slack's control characters, then rewrite links ("[text](<url>)"
            # and "[text](url)"), headings, bullets, and bold.
            body="$(sed -E \
              -e 's/\\([][()*_#`~\\])/\1/g' \
              -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' \
              -e 's/\[([^]]+)\]\(&lt;([^)]+)&gt;\)/<\2|\1>/g' \
              -e 's/\[([^]]+)\]\(([^)]+)\)/<\2|\1>/g' \
              -e 's/^#{1,6} +(.*)$/*\1*/' \
              -e 's/^( *)\* /\1• /' \
              -e 's/^( *)- /\1• /' \
              -e 's/\*\*([^*]+)\*\*/*\1*/g' \
              <<<"$notes")"

            # Slack caps section blocks at 3000 characters.
            if (( ${#body} > 2900 )); then
              body="${body:0:2900}…"$'\n'"<${notes_url:-$release_url}|Read the full notes in Linear>"
            fi
          else
            body="The release completed, but the generated notes were not available in time. <${notes_url:-$release_url}|View the release notes in Linear>"
          fi

          payload="$(jq --null-input --arg header "$header" --arg body "$body" --arg url "$release_url" '{
            blocks: [
              {type: "header", text: {type: "plain_text", text: $header}},
              {type: "section", text: {type: "mrkdwn", text: $body}},
              {type: "context", elements: [{type: "mrkdwn", text: ("<" + $url + "|View this release in Linear>")}]}
            ]
          }')"

          curl --silent --show-error --fail \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$SLACK_CHANGELOG_WEBHOOK_URL"

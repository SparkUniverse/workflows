name: Sync Linear Release

on:
  workflow_call:
    inputs:
      environment-name:
        type: string
        description: "The name of the environment to release to (production or development)"
        required: true
      release-version:
        type: string
        description: "Version identifier applied to the targeted Linear release (e.g. 1.0.0+<commit sha>)"
        required: false

    outputs:
      release-id:
        description: "The Linear release ID"
        value: ${{ jobs.sync-linear-release.outputs.release-id }}
      release-name:
        description: "The Linear release name"
        value: ${{ jobs.sync-linear-release.outputs.release-name }}
      release-version:
        description: "The Linear release version"
        value: ${{ jobs.sync-linear-release.outputs.release-version }}
      release-url:
        description: "URL to the release page in the Linear app"
        value: ${{ jobs.sync-linear-release.outputs.release-url }}

    secrets:
      LINEAR_RELEASE_ACCESS_KEY:
        description: Linear pipeline access key for authentication
        required: true

permissions:
  contents: read

jobs:
  sync-linear-release:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    outputs:
      release-id: ${{ steps.linear-release.outputs.release-id }}
      release-name: ${{ steps.linear-release.outputs.release-name }}
      release-version: ${{ steps.linear-release.outputs.release-version }}
      release-url: ${{ steps.linear-release.outputs.release-url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required for commit history

      - uses: linear/linear-release-action@3b634623620454bac33390451a1dd15ba78e3dc4 # 0.14.4
        id: linear-release
        with:
          access_key: ${{ secrets.LINEAR_RELEASE_ACCESS_KEY }}
          command: ${{ inputs.environment-name == 'production' && 'complete' || 'sync' }}
          version: ${{ inputs.release-version }}

name: Sync Linear Release

on:
  workflow_call:
    inputs:
      environment-name:
        type: string
        description: "The name of the environment to release to (production or development)"
        required: true
      release-version:
        type: string
        description: "Version identifier applied to the targeted Linear release (e.g. 1.0.0+<commit sha>)"
        required: false

    outputs:
      release-id:
        description: "The Linear release ID"
        value: ${{ jobs.sync-linear-release.outputs.release-id }}
      release-name:
        description: "The Linear release name"
        value: ${{ jobs.sync-linear-release.outputs.release-name }}
      release-version:
        description: "The Linear release version"
        value: ${{ jobs.sync-linear-release.outputs.release-version }}
      release-url:
        description: "URL to the release page in the Linear app"
        value: ${{ jobs.sync-linear-release.outputs.release-url }}

    secrets:
      LINEAR_RELEASE_ACCESS_KEY:
        description: Linear pipeline access key for authentication
        required: true

permissions:
  contents: read

jobs:
  sync-linear-release:
    runs-on: namespace-profile-tiny-arm64
    timeout-minutes: 5
    outputs:
      release-id: ${{ steps.linear-complete.outputs.release-id || steps.linear-sync.outputs.release-id }}
      release-name: ${{ steps.linear-complete.outputs.release-name || steps.linear-sync.outputs.release-name }}
      release-version: ${{ steps.linear-complete.outputs.release-version || steps.linear-sync.outputs.release-version }}
      release-url: ${{ steps.linear-complete.outputs.release-url || steps.linear-sync.outputs.release-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Required for commit history

      # Development deploys accumulate issues in the currently started release
      # without stamping a version: only `sync` can set a release's version,
      # and once the started release carries one, a later sync with a different
      # version spawns a fresh release instead of targeting it. The version is
      # therefore only applied on production, immediately before `complete`
      # looks the release up by that exact version.
      - uses: linear/linear-release-action@c0cb8354a362c24c6d3e0948f37fd66d07588e3f # v0.14.5
        id: linear-sync
        with:
          access_key: ${{ secrets.LINEAR_RELEASE_ACCESS_KEY }}
          command: sync
          version: ${{ inputs.environment-name == 'production' && inputs.release-version || '' }}

      - uses: linear/linear-release-action@c0cb8354a362c24c6d3e0948f37fd66d07588e3f # v0.14.5
        id: linear-complete
        if: inputs.environment-name == 'production'
        with:
          access_key: ${{ secrets.LINEAR_RELEASE_ACCESS_KEY }}
          command: complete
          version: ${{ inputs.release-version }}
